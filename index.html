<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Case Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Text Case Converter</h1>
      <p>Transform your text easily into uppercase, lowercase, title case, and more.</p>
    </header>

    <main class="card">
      <div class="textarea-wrapper">
        <textarea 
          id="textInput" 
          placeholder="Type or paste your text here..." 
          rows="10"
          spellcheck="true"
        ></textarea>
      </div>

      <!-- Stats Bar (Character and Word Counter) -->
      <div class="stats-bar">
        <span>Characters: <strong id="charCount">0</strong></span>
        <span>Words: <strong id="wordCount">0</strong></span>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button id="btnUpper" class="btn btn-secondary">UPPERCASE</button>
        <button id="btnLower" class="btn btn-secondary">lowercase</button>
        <button id="btnTitle" class="btn btn-secondary">Title Case</button>
        <button id="btnSentence" class="btn btn-secondary">Sentence Case</button>
        <button id="btnReverse" class="btn btn-secondary">Reverse Text</button>
        <button id="btnCopy" class="btn btn-primary">Copy</button>
        <button id="btnClear" class="btn btn-danger">Clear</button>
      </div>

      <!-- Feedback message / notification -->
      <div id="statusMessage" class="status-message" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <p>Simple &amp; Fast Client-Side Tool</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
